services:
  db:
    image: postgres:15
    container_name: odoo-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo_pass
      - POSTGRES_USER=odoo
    volumes:
      - ./postgres_data:/var/lib/postgresql/data:Z # :Z para SELinux en Fedora
    restart: always

  odoo:
    image: odoo:18.0
    container_name: odoo-app
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_pass
    volumes:
      - ./odoo_data:/var/lib/odoo:Z
      - ./extra-addons:/mnt/extra-addons:Z
      - ./config:/etc/odoo:Z
    restart: always
